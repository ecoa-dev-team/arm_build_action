name: 'ARM Build Action'
description: 'Sets up tools, builds Debug and Release CMake presets, renames binary files, and uploads artifacts.'

inputs:
  branch_name:
    description: 'Branch name from the calling workflow (e.g. github.ref_name)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.27.7'

    - name: Install ARM GCC Toolchain and build tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi ninja-build

    - name: Sanitize branch name
      shell: bash
      run: echo "SANITIZED_BRANCH=$(echo '${{ inputs.branch_name }}' | sed 's/\//-/g')" >> $GITHUB_ENV

    - name: Check CMake version
      shell: bash
      run: cmake --version

    - name: Configure and build Debug
      shell: bash
      run: |
        cmake --preset Debug
        cmake --build --preset Debug

    - name: Configure and build Release
      shell: bash
      run: |
        cmake --preset Release
        cmake --build --preset Release

    - name: List bin files before renaming (feature branches only)
      if: startsWith(inputs.branch_name, 'feature') || startsWith(inputs.branch_name, 'EHD') || startsWith(inputs.branch_name, 'FEATURE')
      shell: bash
      run: |
        echo "Debug bin files:"
        ls -lh build/Debug/*.bin || echo "No debug files"
        echo "Release bin files:"
        ls -lh build/Release/*.bin || echo "No release bin files"

    - name: Rename .bin files with branch name
      if: startsWith(inputs.branch_name, 'feature') || startsWith(inputs.branch_name, 'EHD') || startsWith(inputs.branch_name, 'FEATURE')
      shell: bash
      run: |
        shopt -s nullglob
        for f in build/Debug/*.bin; do
          mv "$f" "build/Debug/$SANITIZED_BRANCH-$(basename "$f")"
        done
        for f in build/Release/*.bin; do
          mv "$f" "build/Release/$SANITIZED_BRANCH-$(basename "$f")"
        done

    - name: List bin files after renaming (feature branches only)
      if: startsWith(inputs.branch_name, 'feature') || startsWith(inputs.branch_name, 'EHD') || startsWith(inputs.branch_name, 'FEATURE')
      shell: bash
      run: |
        echo "Renamed debug bin files:"
        ls -lh build/Debug/*.bin || echo "No debug bin files"
        echo "Renamed release bin files:"
        ls -lh build/Release/*.bin || echo "No release bin files"

    - name: Upload Debug build artifacts
      if: github.event_name == 'push' && (inputs.branch_name == 'Develop' || startsWith(inputs.branch_name, 'feature') || startsWith(inputs.branch_name, 'EHD') || startsWith(inputs.branch_name, 'FEATURE'))
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-Debug
        path: build/Debug/**/*.bin

    - name: Upload Release build artifacts
      if: github.event_name == 'push' && (inputs.branch_name == 'Develop' || startsWith(inputs.branch_name, 'feature') || startsWith(inputs.branch_name, 'EHD') || startsWith(inputs.branch_name, 'FEATURE'))
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-Release
        path: build/Release/**/*.bin